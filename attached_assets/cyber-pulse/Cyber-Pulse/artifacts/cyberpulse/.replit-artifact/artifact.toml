kind = "web"
previewPath = "/"
title = "CyberPulse"
version = "1.0.0"
id = "artifacts/cyberpulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20384

[services.development]
run = "pnpm --filter @workspace/cyberpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cyberpulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/cyberpulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20384"
BASE_PATH = "/"
